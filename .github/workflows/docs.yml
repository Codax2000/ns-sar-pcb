name: Docs

# Regenerates schemdraw figures, builds the Sphinx site, and publishes the
# HTML to the gh-pages branch. GitHub Pages for this repo is "Deploy from a
# branch" (gh-pages, legacy build). Pushing that branch keeps the live site
# at https://codax2000.github.io/ns-sar-pcb/ without a Pages settings change.
# Sphinx writes _static/ and _images/, so Jekyll must stay disabled.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/**/*.py"
      - "hdl_design/hdl_design.srcs/registers/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Matches .python-version and requires-python (>=3.12).
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate diagrams
        run: uv run python ./scripts/diagrams.py

      - name: Build Sphinx HTML
        run: uv run python -m sphinx.cmd.build -b html docs docs/_build/html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          commit_message: "Update documentation"
          enable_jekyll: false
          force_orphan: false
