[project]
name = "ns-sar-pcb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cocotb>=2.1.0",
    "cocotb-bus>=0.3.0",
    "flake8>=7.4.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "pandas>=3.0.6",
    "schemdraw>=0.23",
    "scipy>=1.18.1",
    "sphinx>=9.1.0",
    "sphinx-peakrdl>=0.3.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install this repo into the venv so `import models` works from the
# repository root. The package lives at scripts/models; the sources
# rewrite drops the scripts/ prefix so the import name stays `models`.
[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["scripts/models"]

[tool.hatch.build.targets.wheel.sources]
"scripts" = ""
